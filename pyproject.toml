[project]
name = "regwatch"
version = "1.0.0"
description = "基金监管案例采集、结构化摘要与统计看板（AMAC + CSRC）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "regwatch maintainers" }]
keywords = ["AMAC", "CSRC", "compliance", "streamlit", "regulatory"]

dependencies = [
  "openai>=1.60",
  "typer>=0.12",
  "rich>=13.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "aiohttp>=3.9",
  "pypdf>=4.0",
  "olefile>=0.47",
  "python-docx>=1.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
web = [
  # 1.51 起 st.plotly_chart 支持 width 参数（表格/按钮分别自 1.49/1.48 起）
  "streamlit>=1.51",
  "plotly>=5.24",
  # 仅网页端（表格 / 图表数据）使用，CLI 与分析服务不依赖它
  "pandas>=2.2",
]
dev = [
  "ruff>=0.9",
  "mypy>=1.13",
  "pytest>=8.0",
  "types-requests>=2.32",
  "types-beautifulsoup4>=4.12",
]

[project.scripts]
regwatch = "regwatch.cli.main:app"

[project.urls]
Homepage = "https://example.local/regwatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regwatch"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/README.md",
  "/AGENTS.md",
  "/config.example.json",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources",
]
log_cli_level = "WARNING"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
  ".worktrees",
  "data",
  "docs/archive",
  "AMAC_Discipline_PDFs",
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # bugbear
  "SIM",    # simplify
  "RUF",    # ruff-specific
]
ignore = [
  "E501",   # line length handled by formatter; long CJK strings are common
  "B008",   # typer/fastapi-style default calls in signatures
  "SIM105", # contextlib.suppress is not always clearer for multi-line blocks
  "RUF001", # 中文全角标点在中文文档中是有意为之
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src/regwatch"]
exclude = ["src/regwatch/web/"]
mypy_path = "src"  # 历史遗留，配合 files 使用；CI 直接传 src/regwatch 亦可
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
plugins = []

# 记录类在 __post_init__ 里把数据库/磁盘读到的原始字符串归一化成枚举，
# 这层「宽容构造」无法用类型注解表达，故对这些模块关闭 arg-type 检查。
[[tool.mypy.overrides]]
module = [
  "regwatch.db.repositories.*",
  "regwatch.db.jsonio",
  "regwatch.sources.csrc.*",
  "regwatch.sources.amac",
  "regwatch.services.jobs",
]
disable_error_code = ["arg-type"]
