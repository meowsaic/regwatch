[project]
name = "regwatch"
version = "1.0.0"
description = "基金监管案例采集、结构化摘要与统计看板（AMAC + CSRC）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "regwatch maintainers" }]
keywords = ["AMAC", "CSRC", "compliance", "streamlit", "regulatory"]

dependencies = [
  "openai>=1.60",
  "typer>=0.12",
  "rich>=13.0",
  "pandas>=2.2",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "aiohttp>=3.9",
  "pypdf>=4.0",
  "olefile>=0.47",
  "python-docx>=1.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
web = [
  "streamlit>=1.40",
  "plotly>=5.24",
]
dev = [
  "ruff>=0.9",
  "mypy>=1.13",
  "types-requests>=2.32",
  "types-beautifulsoup4>=4.12",
]

[project.scripts]
regwatch = "regwatch.cli:app"

[project.urls]
Homepage = "https://example.local/regwatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regwatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["regwatch", "web", "tests"]
extend-exclude = [
  ".worktrees",
  "AMAC",
  "CSRC",
  "专项分析报告",
  "_fill_form*.py",
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # bugbear
  "SIM",    # simplify
  "RUF",    # ruff-specific
]
ignore = [
  "E501",   # line length handled by formatter; long CJK strings are common
  "B008",   # typer/fastapi-style default calls in signatures
  "SIM105", # contextlib.suppress is not always clearer for multi-line blocks
  "RUF001", # 中文全角标点在中文文档中是有意为之
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"web/*" = ["E402"]  # Streamlit views insert sys.path before imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["regwatch"]
mypy_path = "."
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
plugins = []
